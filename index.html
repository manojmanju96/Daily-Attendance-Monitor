<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Attendance Monitor</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#174a7d;--navy2:#1d568b;--blue:#1976e8;--blue2:#0d67d5;--bg:#f4f7fb;--card:#fff;--line:#dfe5ec;--text:#23364d;--muted:#6b7280;--green:#18a875;--red:#e93d3d;--shadow:0 3px 12px rgba(24,55,85,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,Arial,sans-serif;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}.topbar{display:none;height:56px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.12);position:sticky;top:0;z-index:20}.back{width:42px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.13);color:#fff;font-size:20px}.backBottom{display:flex;justify-content:flex-end;margin:12px 0 4px}.backBottom button{border:0;background:transparent;color:var(--blue);font-weight:800;font-size:14px;padding:6px 2px}.brand{font-weight:800;font-size:18px}.crumb{font-size:15px;color:#e8f1f9}.wrap{max-width:1280px;margin:auto;padding:15px 16px 25px}.title{font-size:22px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:11px;margin-top:4px}.toolbar,.dashhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.datebox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;text-align:right}.datebox small{font-size:10px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}.btn{border:0;border-radius:7px;padding:8px 12px;font-weight:750;background:#e9eef5;color:#26384d}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.gray{background:#e9eef5}.btn.danger{background:#ffecec;color:#b42318}.btn.small{padding:5px 8px;font-size:11px}.right{display:flex;justify-content:flex-end;gap:8px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ccd5df;border-radius:6px;background:#fff;padding:8px 9px;color:var(--text)}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tablewrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.hscroll .table{min-width:760px}.table{width:100%;border-collapse:collapse;table-layout:auto}.table th,.table td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}.table th{background:#f3f6fa;font-size:10px;font-weight:800}.table td{font-size:12px}.table tr:last-child td{border-bottom:0}.select{border:1px solid #ccd5df;border-radius:5px;padding:5px 6px;background:#fff}.homewrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:20px}.homebox{width:min(760px,100%);text-align:center}.homeTitle{font-size:27px;font-weight:850;letter-spacing:.06em;color:var(--navy)}.homeSub{font-size:14px;letter-spacing:.22em;font-weight:750;color:#23496d;margin:3px 0 22px}.homeActions{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.bigAction{min-height:155px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow);padding:24px;text-align:center;color:var(--text)}.bigAction:first-child{background:linear-gradient(135deg,#1976e8,#0e63c9);color:#fff}.bigAction:last-child{background:linear-gradient(135deg,#1eae7a,#159364);color:#fff}.bigAction .icon{font-size:28px;margin-bottom:10px}.bigAction h2{margin:0 0 5px;font-size:19px}.bigAction p{margin:0;font-size:11px;opacity:.9}.gridAY{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.aycard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;min-height:88px;position:relative;box-shadow:var(--shadow)}.aymain{font-size:16px;font-weight:850;cursor:pointer}.aymeta{font-size:11px;color:var(--muted);margin-top:7px}.dots{position:absolute;right:6px;top:6px;border:0;background:#eef2f6;border-radius:6px;width:23px;height:23px;font-size:15px;line-height:1;padding:0}.menu{display:none;position:absolute;right:8px;top:39px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);z-index:8;overflow:hidden;min-width:150px}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px 11px}.menu button:hover{background:#f5f7fa}.sectionTitle{font-weight:850;font-size:13px;margin-bottom:9px}.semcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.semcard{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fafbfc}.semcard.done{border-color:#a6dfc7;background:#f0fbf6}.status{font-size:10px;font-weight:800;margin-top:5px}.uploadrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note{font-size:10px;color:var(--muted)}
/* Dashboard */
.dashboardGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.wide{grid-column:1/-1}.sessionHead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:3px 3px 1px;margin-top:1px;color:var(--navy);font-size:14px;font-weight:850}.sessionHead b{font-size:14px}.timehead{text-align:center;font-weight:850;color:var(--navy);font-size:14px;margin:2px 0 2px}.summary{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow);text-align:center;min-height:91px}.summary h3{background:#eaf3ff;margin:0;padding:8px;font-size:13px;color:#22527b}.summary .count{font-size:21px;font-weight:850;margin-top:9px}.summary .pct{font-size:11px;color:var(--muted);margin:2px 0 8px}.bar{height:7px;background:#e7edf2;border-radius:99px;margin:0 10px 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.takeRow{text-align:center}.takeBtn{width:100%;min-width:0;min-height:64px;font-size:16px}.quick3 button{min-height:64px}.quick3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick3 button{border:0;border-radius:8px;padding:14px 8px;background:var(--blue);color:#fff;font-weight:800;text-align:center;box-shadow:0 2px 6px rgba(25,118,232,.18);min-height:64px;font-size:13px}.quick3 button:hover{background:var(--blue2)}.quick3 small{display:block;color:#eaf3ff;font-size:10px;font-weight:500;margin-top:4px}
/* Attendance */
.noScroll{overflow:hidden}.attTable th:nth-child(1){width:8%}.attTable th:nth-child(2){width:52%}.attTable th:nth-child(3),.attTable th:nth-child(4){width:20%;text-align:center}.attTable td:nth-child(3),.attTable td:nth-child(4){text-align:center}.toggle{display:flex;justify-content:center}.toggle button{min-width:44px;padding:7px 9px;border:1px solid #cfd7e0;border-radius:8px;background:#fff;color:#687385;font-weight:850}.toggle button.selP{background:#1976e8;color:#fff;border-color:#1976e8}.toggle button.selA{background:#e93d3d;color:#fff;border-color:#e93d3d}.markAll{margin-left:auto}.record{border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px;background:#fff}.recordBody{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.hidden{display:none!important}.collapseBtn{float:right;border:0;background:#eef2f6;border-radius:7px;padding:5px 9px;font-weight:800;color:#23364d}.pill{display:inline-flex;justify-content:center;align-items:center;padding:5px 9px;border-radius:7px;font-weight:850;font-size:11px}.pblue{background:#1976e8;color:#fff}.pred{background:#e93d3d;color:#fff}.recordPreview th:nth-child(1){width:9%}.recordPreview th:nth-child(2){width:51%}.recordPreview th:nth-child(3),.recordPreview th:nth-child(4){width:20%;text-align:center}.recordPreview td:nth-child(3),.recordPreview td:nth-child(4){text-align:center}
/* History */
.histWrap{max-height:64vh;overflow:auto}.historyTable{min-width:max-content;table-layout:auto}.historyTable th:not(:nth-child(1)):not(:nth-child(2)),.historyTable td:not(:nth-child(1)):not(:nth-child(2)){width:78px;min-width:78px;max-width:78px;text-align:center}.historyTable th:nth-child(2),.historyTable td:nth-child(2){width:145px;min-width:145px;max-width:145px}.historyTable th:nth-child(1),.historyTable td:nth-child(1){width:42px;min-width:42px;max-width:42px}.historyTable th:nth-child(1),.historyTable td:nth-child(1){width:55px}.historyTable th:nth-child(2),.historyTable td:nth-child(2){width:190px}.historyTable thead th{position:sticky;top:0;z-index:5}.freezeA,.freezeB{position:sticky;background:#fff;z-index:6}.freezeA{left:0}.freezeB{left:42px}.historyTable thead .freezeA,.historyTable thead .freezeB{background:#f3f6fa;z-index:10}.historyTable .freezeB{box-shadow:2px 0 3px rgba(24,55,85,.05)}.exportRow{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.modal{position:fixed;inset:0;background:rgba(12,28,44,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:15px}.modalbox{background:#fff;border-radius:10px;padding:15px;width:min(780px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:15px;bottom:15px;background:#162a3e;color:#fff;padding:10px 13px;border-radius:7px;display:none;z-index:99}.toast.show{display:block}
@media(max-width:900px){.wrap{padding:11px 10px 18px}.topbar{height:52px;padding:0 10px}.brand{font-size:16px}.crumb{font-size:13px}.dashboardGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.summary{min-height:78px}.summary h3{font-size:11px;padding:7px 3px}.summary .count{font-size:17px;margin-top:7px}.summary .pct{font-size:9px}.bar{height:6px;margin:0 6px 7px}.quick3{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.quick3 button{font-size:13px;padding:12px 5px;min-height:70px}.quick3 small{font-size:10px}.takeBtn{width:100%;min-width:0;min-height:64px;font-size:16px}.quick3 button{min-height:64px}.homeActions{gap:10px}.bigAction{min-height:130px;padding:18px 10px}.bigAction h2{font-size:16px}.bigAction p{display:none}.formgrid{gap:7px}.field input,.field select{padding:7px 6px;font-size:11px}.table th,.table td{padding:6px 5px;font-size:11px}.attTable th:nth-child(2){width:48%}.attTable th:nth-child(3),.attTable th:nth-child(4){width:22%}.recordPreview th,.recordPreview td{font-size:10px;padding:5px 4px}.recordPreview th:nth-child(2){width:48%}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY='attendanceManagerFinal';let db=JSON.parse(localStorage.getItem(KEY)||'{"years":[]}');let state={page:'home',yearId:null,sem:'3rd Sem',attDate:localDateKey(),slot:'9:30 AM',historyFrom:'',historyTo:''};
const sems=['3rd Sem','5th Sem','7th Sem'];function localDateKey(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function year(){return db.years.find(y=>y.id===state.yearId)}function students(y,sem){return y?.sems?.[sem]?.students||[]}function attKey(d,s,sem){return d+'|'+s+'|'+sem}
function header(){return ''}function layout(body,crumb='',back=true){return `<main class="wrap">${body}${back?`<div class="backBottom"><button onclick="goBack()">Back</button></div>`:''}</main>`}
function home(){state.page='home';document.getElementById('app').innerHTML=`<main class="homewrap"><div class="homebox"><div class="homeTitle">DAILY ATTENDANCE</div><div class="homeSub">MANAGER</div><div class="homeActions"><button class="bigAction" onclick="pageYears()"><div class="icon">📚</div><h2>Academic Year</h2><p>Create, manage and open academic years.</p></button><button class="bigAction" onclick="studentDB()"><div class="icon">👥</div><h2>Student Database</h2><p>Manage the separate student database.</p></button></div></div></main>`}
function pageYears(){state.page='years';document.getElementById('app').innerHTML=layout(`<div class="toolbar"><div><h1 class="title">Academic Year</h1></div><button class="btn primary" onclick="newYear()">＋ Add Academic Year</button></div>${db.years.length?`<div class="gridAY">${db.years.map(y=>`<div class="aycard"><button class="dots" onclick="toggleMenu(event,'${y.id}')">⋮</button><div id="menu-${y.id}" class="menu"><button onclick="editYear('${y.id}')">View & Edit</button><button onclick="deleteYear('${y.id}')">Delete Academic Year</button></div><div class="aymain" onclick="openDashboard('${y.id}')">${esc(y.name)}</div><div class="aymeta">${esc(y.department)} · ${Object.values(y.sems||{}).filter(s=>s?.students).length}/3 Semesters</div></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:35px">No Academic Year created yet.</div>`}`,'Academic Year')}
function toggleMenu(e,id){e.stopPropagation();document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));document.getElementById('menu-'+id).classList.toggle('open')}document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));
function newYear(){renderCreation({id:uid(),name:'',department:'',sems:{}})}function editYear(id){let y=db.years.find(x=>x.id===id);renderCreation(JSON.parse(JSON.stringify(y)))}
function renderCreation(y){state.page='creation';state.creation=y;document.getElementById('app').innerHTML=layout(`<div class="toolbar"><div><h1 class="title">Academic Year Creation / Edit</h1></div></div><div class="card"><div class="formgrid"><div class="field"><label>Academic Year</label><input id="yrName" value="${esc(y.name)}"></div><div class="field"><label>Department</label><input id="dept" value="${esc(y.department)}"></div><div class="field"><label>Semester</label><select id="semSel">${sems.map(s=>`<option>${s}</option>`).join('')}</select></div></div></div><div class="card"><div class="sectionTitle">Semester Status</div><div class="semcards">${sems.map(s=>`<div class="semcard ${y.sems?.[s]?.students?'done':''}"><b>${s}</b><div class="status">${y.sems?.[s]?.students?'✓ Uploaded':'Pending'}</div></div>`).join('')}</div></div><div class="card"><div class="sectionTitle">Upload Excel File</div><div class="uploadrow"><input type="file" id="file" accept=".xlsx,.xls,.csv"><button class="btn primary" onclick="uploadFile()">Upload</button><span class="note">Excel / CSV</span></div><div id="preview" style="margin-top:10px"></div></div><div class="right"><button class="btn gray" onclick="pageYears()">Cancel</button><button class="btn primary" onclick="saveCreation()">Save</button></div>`,'Academic Year Creation')}
async function uploadFile(){let f=document.getElementById('file').files[0];if(!f)return toast('Select a file');let rows=[];try{let data=await f.arrayBuffer();let wb=XLSX.read(data,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(e){return toast('Could not read file')}let h=(rows[0]||[]).map(x=>String(x).trim().toLowerCase());let find=a=>{for(let n of a){let i=h.findIndex(x=>x===n||x.includes(n));if(i>=0)return i}return -1};let ui=find(['usn']),ni=find(['student name','full name','name']);let data=rows.slice(1).filter(r=>r.some(v=>String(v).trim())).map(r=>({id:uid(),usn:String(r[ui>=0?ui:0]||''),name:String(r[ni>=0?ni:1]||''),status:'Active',admission:'Regular'}));if(!data.length)return toast('No student rows found');state.uploadPreview=data;renderUploadPreview()}
function renderUploadPreview(){let d=state.uploadPreview||[];document.getElementById('preview').innerHTML=`<div class="sectionTitle">Preview — ${d.length} students</div><div class="tablewrap hscroll"><table class="table"><thead><tr><th>Sl No</th><th>USN</th><th>Student Name</th><th>Status</th><th>Admission Type</th></tr></thead><tbody>${d.map((s,i)=>`<tr><td>${i+1}</td><td><input class="select" value="${esc(s.usn)}" onchange="state.uploadPreview[${i}].usn=this.value"></td><td><input class="select" value="${esc(s.name)}" onchange="state.uploadPreview[${i}].name=this.value"></td><td><select class="select" onchange="state.uploadPreview[${i}].status=this.value"><option ${s.status==='Active'?'selected':''}>Active</option><option ${s.status==='Detained'?'selected':''}>Detained</option><option ${s.status==='Discontinued'?'selected':''}>Discontinued</option></select></td><td><select class="select" onchange="state.uploadPreview[${i}].admission=this.value"><option ${s.admission==='Regular'?'selected':''}>Regular</option><option ${s.admission==='Lateral Entry'?'selected':''}>Lateral Entry</option><option ${s.admission==='Re-admission'?'selected':''}>Re-admission</option></select></td></tr>`).join('')}</tbody></table></div><div class="right" style="margin-top:8px"><button class="btn primary" onclick="saveSemester()">Save Semester</button></div>`}
function saveSemester(){let y=state.creation,sem=document.getElementById('semSel').value;y.name=document.getElementById('yrName').value.trim();y.department=document.getElementById('dept').value.trim();if(!y.name||!y.department)return toast('Enter Academic Year and Department');if(!state.uploadPreview?.length)return toast('Upload student data first');y.sems=y.sems||{};y.sems[sem]={students:JSON.parse(JSON.stringify(state.uploadPreview))};state.uploadPreview=null;renderCreation(y);toast(sem+' saved')}
function saveCreation(){let y=state.creation;y.name=document.getElementById('yrName').value.trim();y.department=document.getElementById('dept').value.trim();if(!y.name||!y.department)return toast('Enter Academic Year and Department');if(!Object.values(y.sems||{}).some(s=>s?.students?.length))return toast('Upload at least one semester');let i=db.years.findIndex(x=>x.id===y.id);if(i>=0)db.years[i]=y;else db.years.push(y);saveDB();pageYears();toast('Saved')}
function deleteYear(id){if(confirm('Delete this Academic Year and its attendance data?')){db.years=db.years.filter(y=>y.id!==id);saveDB();pageYears()}}function openDashboard(id){state.yearId=id;dashboard()}
function summaryCard(y,s,slot){let st=students(y,s),r=y.attendance?.[attKey(new Date().toISOString().slice(0,10),slot,s)],p=r?r.records.filter(x=>x.status==='P').length:0,t=st.filter(x=>x.status!=='Discontinued').length,pct=t?Math.round(p/t*100):0;return `<div class="summary"><h3>${s}</h3><div class="count">${p} / ${t}</div><div class="pct">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div>`}
function dashboard(){let y=year();if(!y)return pageYears();let today=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});document.getElementById('app').innerHTML=layout(`<div class="dashhead"><div><h1 class="title">Dashboard</h1><div class="sub">Academic Year: <b>${esc(y.name)}</b> · ${esc(y.department)}</div></div><div class="datebox"><small>Today's Date</small><br><b>${today}</b></div></div><div class="dashboardGrid">${[['Morning session','9:30 AM'],['Afternoon session','2:30 PM']].map(([label,slot])=>`<div class="sessionHead"><span>${label}</span><b>${slot}</b></div>${sems.map(s=>summaryCard(y,s,slot)).join('')}`).join('')}<div class="wide takeRow"><button class="btn primary takeBtn" onclick="attendance()">▣ &nbsp; Take Attendance</button></div><div class="wide card"><div class="sectionTitle">Quick Access</div><div class="quick3"><button onclick="studentData()">👥 Student Data<small>View & edit</small></button><button onclick="attendance()">▣ Attendance Record<small>Take / update</small></button><button onclick="historyPage()">▤ History<small>Track records</small></button><button onclick="shortagePage()">▥ Shortage<small>Attendance shortage</small></button></div></div></div>`,'Dashboard / '+y.name)}
function studentData(){let y=year();state.page='student';state.newStudent=false;document.getElementById('app').innerHTML=layout(`<div class="toolbar"><div><h1 class="title">Student Data</h1></div><button class="btn primary" onclick="addStudentRow()">＋ Add New Student</button></div><div class="card"><div class="formgrid"><div class="field"><label>Academic Year</label><input value="${esc(y.name)}" disabled></div><div class="field"><label>Department</label><input value="${esc(y.department)}" disabled></div><div class="field"><label>Semester</label><select id="studentSem">${sems.map(s=>`<option>${s}</option>`).join('')}</select></div></div></div><div class="card noScroll"><div class="tablewrap hscroll"><table class="table"><thead><tr><th>Sl No</th><th>USN</th><th>Student Name</th><th>Status</th><th>Admission Type</th></tr></thead><tbody id="studentBody"></tbody></table></div><div class="right" style="margin-top:8px"><button class="btn gray" onclick="dashboard()">Cancel</button><button class="btn primary" onclick="saveStudentEdits()">Save</button></div></div>`,'Student Data / '+y.name);document.getElementById('studentSem').value=state.sem;document.getElementById('studentSem').onchange=()=>{state.sem=document.getElementById('studentSem').value;state.newStudent=false;fillStudentTable()};fillStudentTable()}
function fillStudentTable(){let b=document.getElementById('studentBody');if(!b)return;let rows=students(year(),state.sem).map((s,i)=>`<tr data-row="${s.id}"><td>${i+1}</td><td><input class="select" data-f="usn" value="${esc(s.usn)}"></td><td><input class="select" data-f="name" value="${esc(s.name)}"></td><td><select class="select" data-f="status"><option ${s.status==='Active'?'selected':''}>Active</option><option ${s.status==='Detained'?'selected':''}>Detained</option><option ${s.status==='Discontinued'?'selected':''}>Discontinued</option></select></td><td><select class="select" data-f="admission"><option ${s.admission==='Regular'?'selected':''}>Regular</option><option ${s.admission==='Lateral Entry'?'selected':''}>Lateral Entry</option><option ${s.admission==='Re-admission'?'selected':''}>Re-admission</option></select></td></tr>`).join('');if(state.newStudent)rows+=`<tr id="newStudentRow"><td>+</td><td><input id="newUSN" class="select" placeholder="USN"></td><td><input id="newName" class="select" placeholder="Student Name"></td><td><select id="newStatus" class="select"><option>Active</option><option>Detained</option><option>Discontinued</option></select></td><td><select id="newAdmission" class="select"><option>Regular</option><option>Lateral Entry</option><option>Re-admission</option></select></td></tr>`;b.innerHTML=rows||'<tr><td colspan="5" style="text-align:center">No students</td></tr>'}
function addStudentRow(){state.newStudent=true;fillStudentTable();setTimeout(()=>document.getElementById('newUSN')?.focus(),50)}
function saveStudentEdits(){let y=year();document.querySelectorAll('#studentBody tr[data-row]').forEach(tr=>{let s=students(y,state.sem).find(x=>x.id===tr.dataset.row);tr.querySelectorAll('[data-f]').forEach(e=>s[e.dataset.f]=e.value)});if(state.newStudent){let u=document.getElementById('newUSN')?.value.trim(),n=document.getElementById('newName')?.value.trim();if(u||n){if(!u||!n)return toast('Enter both USN and Student Name');y.sems[state.sem]=y.sems[state.sem]||{students:[]};y.sems[state.sem].students.push({id:uid(),usn:u,name:n,status:document.getElementById('newStatus').value,admission:document.getElementById('newAdmission').value})}}saveDB();state.newStudent=false;toast('Student data saved');fillStudentTable()}
function attendance(){let y=year();state.page='attendance';document.getElementById('app').innerHTML=layout(`<div class="toolbar"><div><h1 class="title">Attendance Record</h1></div></div><div class="card"><div class="formgrid"><div class="field"><label>Date</label><input type="date" id="attDate" value="${state.attDate}"></div><div class="field"><label>Time Slot</label><select id="slot"><option>9:30 AM</option><option>2:30 PM</option></select></div><div class="field"><label>Semester</label><select id="attSem">${sems.map(s=>`<option>${s}</option>`).join('')}</select></div></div></div><div class="card noScroll"><div id="existingNote"></div><div style="display:flex;align-items:center;margin-bottom:7px"><b style="font-size:12px">Student Attendance</b><button class="btn primary markAll" onclick="markAllPresent()">✓ Mark All Present</button></div><div class="tablewrap"><table class="table attTable"><thead><tr><th>Sl No</th><th>USN / Student Name</th><th>Present</th><th>Absent</th></tr></thead><tbody id="attBody"></tbody></table></div><div class="right" style="margin-top:8px"><button class="btn gray" onclick="dashboard()">Cancel</button><button class="btn primary" onclick="saveAttendance()">Save</button></div></div><div class="card"><div class="sectionTitle">Recorded Attendance — All Semesters</div><div id="recordCards"></div></div>`,'Attendance Record / '+y.name);document.getElementById('slot').value=state.slot;document.getElementById('attSem').value=state.sem;document.getElementById('attDate').onchange=renderAttendanceTable;document.getElementById('slot').onchange=()=>{state.slot=document.getElementById('slot').value;renderAttendanceTable()};document.getElementById('attSem').onchange=()=>{state.sem=document.getElementById('attSem').value;renderAttendanceTable()};renderAttendanceTable();renderRecordCards()}
function renderAttendanceTable(){let y=year(),date=document.getElementById('attDate').value,slot=document.getElementById('slot').value,sem=document.getElementById('attSem').value;state.attDate=date;state.slot=slot;state.sem=sem;let rec=y.attendance?.[attKey(date,slot,sem)];document.getElementById('existingNote').innerHTML=rec?`<span class="pill" style="background:#fff3cd;color:#805b12;margin-bottom:7px">Already taken — ${esc(date)} · ${esc(slot)}. You can update it.</span>`:'';document.getElementById('attBody').innerHTML=students(y,sem).filter(s=>s.status!=='Discontinued').map((s,i)=>{let old=rec?.records.find(x=>x.id===s.id)?.status;return `<tr data-att="${s.id}" data-choice="${old||''}"><td>${i+1}</td><td><b>${esc(s.usn)}</b><br>${esc(s.name)}</td><td><div class="toggle"><button class="${old==='P'?'selP':''}" onclick="pick('${s.id}','P')">P</button></div></td><td><div class="toggle"><button class="${old==='A'?'selA':''}" onclick="pick('${s.id}','A')">A</button></div></td></tr>`}).join('')||'<tr><td colspan="4" style="text-align:center">No active students</td></tr>'}
function pick(id,val){let tr=document.querySelector(`tr[data-att="${id}"]`);if(!tr)return;tr.dataset.choice=val;tr.querySelectorAll('.toggle button').forEach(b=>b.className='');tr.children[val==='P'?2:3].querySelector('button').className=val==='P'?'selP':'selA'}function markAllPresent(){document.querySelectorAll('#attBody tr[data-att]').forEach(tr=>{tr.dataset.choice='P';tr.querySelectorAll('.toggle button').forEach(b=>b.className='');tr.children[2].querySelector('button').className='selP'});toast('All active students marked Present')}
function saveAttendance(){let y=year(),date=document.getElementById('attDate').value,slot=document.getElementById('slot').value,sem=document.getElementById('attSem').value;y.attendance=y.attendance||{};let key=attKey(date,slot,sem),old=y.attendance[key];let records=students(y,sem).filter(s=>s.status!=='Discontinued').map(s=>{let tr=document.querySelector(`tr[data-att="${s.id}"]`);return{id:s.id,status:tr?.dataset.choice||old?.records.find(x=>x.id===s.id)?.status||'A'}});if(!records.length)return toast('No students');y.attendance[key]={date,slot,sem,records};saveDB();toast(old?'Attendance updated':'Attendance saved');attendance()}
function renderRecordCards(){let box=document.getElementById('recordCards');if(!box)return;let y=year(),all=y.attendance||{},today=localDateKey();box.innerHTML=sems.map((sem,si)=>{let keys=Object.keys(all).filter(k=>k.endsWith('|'+sem)&&all[k].date===today).sort().reverse();if(!keys.length)return `<div class="record"><b>${sem}</b><span style="margin-left:10px;color:#98a2b3">No attendance today</span></div>`;let sid='sem-'+si;return `<div class="record"><b>${sem} recorded</b><span style="margin-left:10px;color:#667085">${keys.length} session${keys.length>1?'s':''} today</span><button class="collapseBtn" style="color:var(--blue);background:#eaf3ff" onclick="toggleRecord('${sid}',this)">▼</button><div id="${sid}" class="recordBody hidden">${keys.map((k,ri)=>{let r=all[k],p=r.records.filter(x=>x.status==='P').length,total=r.records.length,rid='rec-'+si+'-'+ri;return `<div class="record" style="background:#fafbfc"><b>${esc(r.date)} · ${esc(r.slot)}</b><span style="margin-left:10px;color:#667085">${p}/${total} present (${total?Math.round(p/total*100):0}%)</span><button class="collapseBtn" style="color:var(--blue);background:#eaf3ff" onclick="toggleRecord('${rid}',this)">▼</button><div id="${rid}" class="recordBody"><div class="tablewrap"><table class="table attTable recordPreview"><thead><tr><th>Sl No</th><th>USN / Student Name</th><th>Present</th><th>Absent</th></tr></thead><tbody>${r.records.map((x,j)=>{let st=students(y,sem).find(q=>q.id===x.id);if(!st)return '';return `<tr><td>${j+1}</td><td><b>${esc(st.usn)}</b><br>${esc(st.name)}</td><td style="text-align:center">${x.status==='P'?'<span class="pill pblue">P</span>':'—'}</td><td style="text-align:center">${x.status==='A'?'<span class="pill pred">A</span>':'—'}</td></tr>`}).join('')}</tbody></table></div></div></div>`}).join('')}</div></div>`}).join('')}
function toggleRecord(id,btn){let el=document.getElementById(id);if(!el)return;el.classList.toggle('hidden');if(btn)btn.textContent=el.classList.contains('hidden')?'▼':'▲'}
function historyPage(){let y=year();document.getElementById('app').innerHTML=layout(`<div class="toolbar"><h1 class="title">History</h1></div><div class="card"><div class="formgrid"><div class="field"><label>Semester</label><select id="histSem">${sems.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>From</label><input id="from" type="date" value="${state.historyFrom}"></div><div class="field"><label>To</label><input id="to" type="date" value="${state.historyTo}"></div></div></div><div class="card"><div id="historyOut"></div></div>`,'History / '+y.name);document.getElementById('histSem').value=state.sem;['histSem','from','to'].forEach(id=>document.getElementById(id).onchange=renderHistory);renderHistory()}
function renderHistory(){let y=year(),sem=document.getElementById('histSem').value,from=document.getElementById('from').value,to=document.getElementById('to').value;state.sem=sem;state.historyFrom=from;state.historyTo=to;let dates=[...new Set(Object.values(y.attendance||{}).filter(r=>r.sem===sem&&(!from||r.date>=from)&&(!to||r.date<=to)).map(r=>r.date))].sort();let st=students(y,sem).filter(s=>s.status!=='Discontinued');if(!dates.length){document.getElementById('historyOut').innerHTML='<div style="padding:30px;text-align:center;color:#667085">No attendance records for the selected range.</div>';return}document.getElementById('historyOut').innerHTML=`<div class="note" style="margin-bottom:7px">${dates.length} attendance date(s) recorded · Swipe horizontally to view additional dates. Sl No and USN / Student Name stay frozen.</div><div class="histWrap"><table class="table historyTable"><thead><tr><th class="freezeA">Sl No</th><th class="freezeB">USN / Student Name</th>${dates.map(d=>`<th>${esc(d)}<br><span class="note">AM / PM</span></th>`).join('')}</tr></thead><tbody>${st.map((s,i)=>`<tr><td class="freezeA">${i+1}</td><td class="freezeB"><b>${esc(s.usn)}</b><br>${esc(s.name)}</td>${dates.map(d=>`<td>${['9:30 AM','2:30 PM'].map(slot=>{let r=y.attendance?.[attKey(d,slot,sem)],v=r?.records.find(x=>x.id===s.id)?.status;return v?`<span class="pill ${v==='P'?'pblue':'pred'}">${v}</span>`:'—'}).join(' ')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="exportRow"><button class="btn primary" onclick="exportHistory('xlsx')">EXPORT TO EXCEL</button><button class="btn primary" onclick="exportHistory('pdf')">EXPORT TO PDF</button></div>`}
function shortagePage(){let y=year();state.page='shortage';document.getElementById('app').innerHTML=layout(`<div class="toolbar"><h1 class="title">Shortage</h1></div><div class="card"><div class="formgrid"><div class="field"><label>Sem</label><select id="shortSem">${sems.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Shortage</label><select id="shortRule"><option value="75">Less than 75%</option><option value="76-84">Between 76 to 84%</option></select></div><div class="field" style="align-self:end"><button class="btn primary" style="width:100%" onclick="renderShortage()">Show</button></div></div></div><div class="card"><div id="shortageOut"></div></div>`,'Shortage / '+y.name);renderShortage()}
function renderShortage(){let y=year(),sem=document.getElementById('shortSem').value,rule=document.getElementById('shortRule').value,st=students(y,sem).filter(s=>s.status!=='Discontinued'),taken={};Object.values(y.attendance||{}).filter(r=>r.sem===sem).forEach(r=>{r.records.forEach(x=>{taken[x.id]=taken[x.id]||{p:0,t:0};taken[x.id].t++;if(x.status==='P')taken[x.id].p++})});let rows=st.map((s,i)=>{let q=taken[s.id]||{p:0,t:0},pct=q.t?Math.round(q.p/q.t*100):0,match=rule==='75'?pct<75:pct>=76&&pct<=84;return match?`<tr><td>${i+1}</td><td><b>${esc(s.usn)}</b><br>${esc(s.name)}</td><td>${q.p}</td><td>${q.t}</td><td><span class="pill ${pct<75?'pred':'pblue'}">${pct}%</span></td></tr>`:''}).join('');document.getElementById('shortageOut').innerHTML=`<div class="tablewrap hscroll"><table class="table"><thead><tr><th>Sl No</th><th>USN / Student Name</th><th>No. Attended</th><th>No. Classes Taken</th><th>%</th></tr></thead><tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:#667085">No students match this shortage range.</td></tr>'}</tbody></table></div><div class="exportRow"><button class="btn primary" onclick="exportShortage('xlsx')">EXPORT TO EXCEL</button><button class="btn primary" onclick="exportShortage('pdf')">EXPORT TO PDF</button></div>`}
function exportShortage(type){let y=year(),sem=document.getElementById('shortSem').value,rule=document.getElementById('shortRule').value,st=students(y,sem).filter(s=>s.status!=='Discontinued'),taken={};Object.values(y.attendance||{}).filter(r=>r.sem===sem).forEach(r=>r.records.forEach(x=>{taken[x.id]=taken[x.id]||{p:0,t:0};taken[x.id].t++;if(x.status==='P')taken[x.id].p++}));let rows=st.map((s,i)=>{let q=taken[s.id]||{p:0,t:0},pct=q.t?Math.round(q.p/q.t*100):0,match=rule==='75'?pct<75:pct>=76&&pct<=84;return match?[i+1,s.usn+' / '+s.name,q.p,q.t,pct+'%']:null}).filter(Boolean);if(type==='xlsx'){let ws=XLSX.utils.aoa_to_sheet([['Academic Year',y.name],['Department',y.department],['Semester',sem],['Shortage',rule==='75'?'Less than 75%':'Between 76 to 84%'],[],['Sl No','USN / Student Name','No. Attended','No. Classes Taken','%'],...rows]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Shortage');XLSX.writeFile(wb,`${y.name}_${sem}_Shortage.xlsx`);return}let w=window.open('','_blank');if(!w)return toast('Allow pop-ups');w.document.write(`<html><head><title>Shortage</title><style>@page{size:A4 portrait;margin:12mm}body{font-family:Arial;font-size:11px}table{border-collapse:collapse;width:auto}th,td{border:1px solid #333;padding:6px 8px;text-align:left}th{background:#eee}</style></head><body><h2>Shortage Report</h2><p>Academic Year: ${esc(y.name)}<br>Department: ${esc(y.department)}<br>Semester: ${esc(sem)}<br>Shortage: ${rule==='75'?'Less than 75%':'Between 76 to 84%'}</p><table><tr><th>Sl No</th><th>USN / Student Name</th><th>No. Attended</th><th>No. Classes Taken</th><th>%</th></tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function exportPage(){historyPage()}
function exportHistory(type){let y=year(),sem=document.getElementById('histSem').value,from=document.getElementById('from').value,to=document.getElementById('to').value,dates=[...new Set(Object.values(y.attendance||{}).filter(r=>r.sem===sem&&(!from||r.date>=from)&&(!to||r.date<=to)).map(r=>r.date))].sort(),st=students(y,sem).filter(s=>s.status!=='Discontinued');if(type==='xlsx'){let rows=[['Academic Year',y.name],['Department',y.department],['Sem',sem],['From Date',from],['To Date',to],[],['Sl No','USN / Student Name',...dates.flatMap(d=>[d+' AM',d+' PM'])]];st.forEach((s,i)=>{let r=[i+1,s.usn+' / '+s.name];dates.forEach(d=>['9:30 AM','2:30 PM'].forEach(slot=>{let rec=y.attendance?.[attKey(d,slot,sem)];r.push(rec?.records.find(x=>x.id===s.id)?.status||'')}));rows.push(r)});let ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Attendance');XLSX.writeFile(wb,`${y.name}_${sem}_Attendance.xlsx`);return}let head=`<h2>Attendance History</h2><table class="meta"><tr><td>Academic Year</td><td>${esc(y.name)}</td></tr><tr><td>Department</td><td>${esc(y.department)}</td></tr><tr><td>Semester</td><td>${esc(sem)}</td></tr><tr><td>From Date</td><td>${esc(from||'—')}</td></tr><tr><td>To Date</td><td>${esc(to||'—')}</td></tr></table>`;let th='<tr><th>Sl No</th><th>USN / Student Name</th>'+dates.map(d=>`<th>${esc(d)}<br>AM / PM</th>`).join('')+'</tr>';let rows=st.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.usn)} / ${esc(s.name)}</td>${dates.map(d=>`<td>${['9:30 AM','2:30 PM'].map(slot=>{let r=y.attendance?.[attKey(d,slot,sem)],v=r?.records.find(x=>x.id===s.id)?.status;return v||'—'}).join(' / ')}</td>`).join('')}</tr>`).join('');let w=window.open('','_blank');if(!w)return toast('Allow pop-ups');w.document.write(`<!doctype html><html><head><title>Attendance History</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial;font-size:10px}.meta,.tbl{border-collapse:collapse}.meta{margin-bottom:12px}.meta td{border:1px solid #999;padding:4px 8px}.tbl{width:auto;max-width:100%;table-layout:auto}.tbl th,.tbl td{white-space:nowrap}.tbl th:nth-child(2),.tbl td:nth-child(2){white-space:normal;max-width:260px}.tbl th,.tbl td{border:1px solid #333;padding:4px 6px;text-align:center;white-space:nowrap}.tbl th:nth-child(2),.tbl td:nth-child(2){white-space:normal}.tbl th{background:#eee}</style></head><body>${head}<table class="tbl">${th}${rows}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function studentDB(){document.getElementById('app').innerHTML=layout(`<h1 class="title">Student Database</h1><div class="card" style="margin-top:12px">Separate module. Detailed Student Database requirements can be added later.</div>`,'Student Database')}
function goBack(){if(state.page==='home')return; if(state.page==='years'||state.page==='studentdb')return home(); if(state.page==='creation')return pageYears(); if(state.page==='dashboard')return home(); return dashboard()}
home();
</script></body></html>
